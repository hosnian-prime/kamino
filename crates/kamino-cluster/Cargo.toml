[package]
name = "kamino-cluster"
description = "SWIM membership, routing table, replication and inter-node forwarding for Kamino."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["discovery-static", "discovery-dns"]
discovery-static = []
discovery-dns = []
discovery-kubernetes = []
discovery-consul = []
# In-memory `MockTransport` for deterministic SWIM tests. Enabled by integration
# tests inside this crate; downstream consumers may opt-in for their own
# simulations.
mock-transport = []

[dependencies]
kamino-core = { workspace = true }
kamino-storage = { workspace = true }
kamino-protocol = { workspace = true }
kamino-observability = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync", "test-util"] }
tokio-util = { workspace = true, features = ["rt"] }
turmoil = { workspace = true }
proptest = { workspace = true }
assert_matches = { workspace = true }
tracing = { workspace = true }
# Self-reference enables the `mock-transport` feature for integration tests so
# they can use the in-memory `MockTransport`. Documented Cargo pattern; works
# on stable. An explicit version satisfies `cargo-deny`'s wildcard ban.
kamino-cluster = { path = ".", version = "0.0.0", features = ["mock-transport"] }
