[workspace]
resolver = "2"
members = [
    "crates/kamino-core",
    "crates/kamino-storage",
    "crates/kamino-protocol",
    "crates/kamino-cluster",
    "crates/kamino-observability",
    "crates/kamino-client",
    "crates/kamino-server",
    "crates/kamino-cli",
    "crates/kamino",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hosnian-prime/kamino"
authors = ["Kamino contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Declare `--cfg loom` (used by the kamino-storage Locker model test) so
# normal builds don't warn about an unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[workspace.dependencies]
# Internal crates
kamino-core = { path = "crates/kamino-core", version = "0.0.0" }
kamino-storage = { path = "crates/kamino-storage", version = "0.0.0" }
kamino-protocol = { path = "crates/kamino-protocol", version = "0.0.0" }
kamino-cluster = { path = "crates/kamino-cluster", version = "0.0.0" }
kamino-observability = { path = "crates/kamino-observability", version = "0.0.0" }
kamino-client = { path = "crates/kamino-client", version = "0.0.0" }
kamino-server = { path = "crates/kamino-server", version = "0.0.0" }

# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Errors and tracing
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Serde + formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmp-serde = "1.3"
humantime-serde = "1.1"
humantime = "2.1"

# Hashing + bytes
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytes = "1.7"

# Concurrency primitives
parking_lot = "0.12"

# Parser combinator (for RESP)
winnow = "0.6"

# Storage helpers
roaring = "0.10"
regex = "1.10"

# Logging detail / IDs
rand = { version = "0.8", features = ["small_rng"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Cluster / SWIM
socket2 = { version = "0.5", features = ["all"] }

# Dev / test
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
assert_matches = "1.5"
loom = "0.7"
turmoil = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = "line-tables-only"

[profile.test]
opt-level = 1
